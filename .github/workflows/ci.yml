name: BrightonLive CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest

      - name: Deterministic offline pipeline
        run: python run.py offline

      - name: Validate outputs
        run: python scripts/validate_outputs.py --allow-empty

      - name: Validate repository and public_html
        run: python scripts/validate_repo.py

      - name: Generate integrity manifest
        run: python scripts/generate_integrity_manifest.py

      - name: Upload offline audit
        uses: actions/upload-artifact@v4
        with:
          name: brightonlive-offline-ci
          path: |
            exports/brighton/
            MANIFEST.json
            SHA256SUMS.txt
          if-no-files-found: error
