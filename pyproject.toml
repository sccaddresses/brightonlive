[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brightonlive"
version = "0.1.0"
description = "Evidence-led local directory, events and website pipeline for BrightonLive"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "icalendar>=6.1",
  "rapidfuzz>=3.9",
  "jsonschema>=4.23",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
brightonlive = "brightonlive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
