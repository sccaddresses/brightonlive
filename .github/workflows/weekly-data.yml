name: BrightonLive Weekly Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
      GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests first
        run: pytest

      - name: Probe configured sources
        continue-on-error: true
        run: python scripts/source_probe.py

      - name: Live Brighton run
        run: python run.py run --config config/brighton.yaml

      - name: Validate candidate output contracts
        run: python scripts/validate_outputs.py --allow-empty

      - name: Create release report
        run: python scripts/release_gate.py

      - name: Determine release readiness
        id: gate
        shell: bash
        run: |
          READY=$(python - <<'PY'
          import json
          print(str(bool(json.load(open('exports/brighton/release-report.json'))['release_ready'])).lower())
          PY
          )
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "release_ready=$READY"

      - name: Repository/site validation
        run: python scripts/validate_repo.py

      - name: Public candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: brightonlive-public-candidate
          path: |
            exports/brighton/directory/public/
            exports/brighton/events/public/
            exports/brighton/release-report.json
            exports/brighton/source-health.json
            exports/brighton/source-probes.json
          if-no-files-found: error

      - name: Review queue artifact
        uses: actions/upload-artifact@v7
        with:
          name: brightonlive-review
          path: |
            exports/brighton/directory/review/
            exports/brighton/events/review/
            exports/brighton/source-probes.json
          if-no-files-found: warn

      - name: Internal audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: brightonlive-internal-audit
          path: |
            exports/brighton/directory/internal/
            exports/brighton/events/internal/
            exports/brighton/source-health.json
          if-no-files-found: error

      # Only a fully passing release may replace the last-known-good public feeds.
      - name: Promote passed release into webroot
        if: steps.gate.outputs.ready == 'true'
        run: python scripts/promote_release.py

      - name: Commit passed public feeds
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "brightonlive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_html/assets/data published/brighton
          if git diff --cached --quiet; then
            echo "No governed public-feed changes to commit."
          else
            git commit -m "Update governed BrightonLive public feeds"
            git push origin HEAD:main
          fi
